name: CI

on:
  push:
    branches: [main, next]
  pull_request:
    branches: [main, next]

permissions:
  contents: read

jobs:
  test:
    name: Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        elixir: ["1.17"]
        otp: ["27"]

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Run tests
        run: mix test

      - name: Credo
        run: mix credo

  # EDA's own environment always has Rustler, so nothing in the test suite can notice when
  # EDA stops compiling without it — which is exactly how 0.4.0 shipped unusable for anyone
  # who had not added `:rustler` themselves. This job builds EDA the way a consumer does.
  consumer-without-rustler:
    name: Consumer project without Rustler
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          path: eda

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.17"
          otp-version: "27"

      - name: Create a consumer that depends on EDA but not on Rustler
        run: |
          mkdir -p consumer/lib
          cat > consumer/mix.exs <<'EOF'
          defmodule Consumer.MixProject do
            use Mix.Project

            def project,
              do: [app: :consumer, version: "0.1.0", elixir: "~> 1.17", deps: [{:eda, path: "../eda"}]]

            def application, do: [extra_applications: [:logger]]
          end
          EOF
          echo 'defmodule Consumer do end' > consumer/lib/consumer.ex
          cat > consumer/check.exs <<'EOF'
          EDA.Cache.put_me(%{"id" => "1", "username" => "ci"})
          state = %{guild_id: "1", session_id: "s", token: "t", heartbeat_interval: nil, heartbeat_ref: nil}
          hello = %{"op" => 8, "d" => %{"heartbeat_interval" => 41_250}}

          if EDA.Voice.Dave.Native.available?() do
            # The precompiled NIF was downloaded for this version: DAVE is on by default.
            {:reply, identify, _} = EDA.Voice.Event.handle(hello, state)
            1 = identify.d[:max_dave_protocol_version]
            IO.puts("EDA compiles without Rust and loads the precompiled DAVE NIF")
          else
            # No binary for this version yet (unreleased) or this platform: the stubs raise, and
            # DAVE must not be advertised to Discord.
            try do
              EDA.Voice.Dave.Native.new_session(1, 0, 0)
              raise "the NIF stub returned instead of raising :nif_not_loaded"
            rescue
              e in ErlangError -> :nif_not_loaded = e.original
            end

            Application.put_env(:eda, :dave, true)
            {:reply, identify, _} = EDA.Voice.Event.handle(hello, state)
            nil = identify.d[:max_dave_protocol_version]
            IO.puts("EDA compiles without Rust and degrades cleanly without the DAVE NIF")
          end
          EOF

      - name: EDA compiles without Rustler
        working-directory: consumer
        run: |
          mix deps.get
          if [ -d deps/rustler ]; then echo "rustler was pulled in, the check is meaningless"; exit 1; fi
          mix compile

      - name: DAVE loads, or degrades instead of crashing
        working-directory: consumer
        run: mix run check.exs

  # Consumers compile EDA on whatever Elixir they run. Warnings that only a newer compiler
  # reports are usually deprecations on their way to becoming errors, so EDA's own code must
  # stay warning-free there too. Compile only: the suite is certified on the pinned toolchain.
  newest-elixir:
    name: Compiles warning-free on Elixir 1.20 / OTP 29
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20"
          otp-version: "29"

      - name: Install dependencies
        run: mix deps.get

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors
